version: "3.8"

# Plataforma de observabilidade (destino externo dos logs do Centry).
# O Centry em si não roda em containers (ver tech_restrictions_context.md);
# este compose só sobe Elasticsearch + Kibana. O Filebeat que lê o arquivo
# gerado pela gem centry_observability roda diretamente no host do Centry
# (ver infra/filebeat/filebeat.yml e docs/integration-guide.md).
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.23
    container_name: centry-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.23
    container_name: centry-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  es_data:
